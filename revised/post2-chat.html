<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLP Lost & Found — Chat with Clent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="chat">

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span>●●●</span>
    </div>

    <div class="screen">

      <!-- Chat header -->
      <div class="chat-header">
        <a href="post2.html" class="chat-header-icon" id="chatBack" title="Back">
          <i class="ti ti-arrow-left"></i>
        </a>
        <div class="chat-header-user">
          <div class="chat-header-avatar">C</div>
          <div class="chat-header-name">Clent</div>
        </div>
        <div class="chat-header-icon" title="More">
          <i class="ti ti-dots-vertical"></i>
        </div>
      </div>

      <!-- Chat body -->
      <div class="chat-body">

        <!-- Profile intro -->
        <div class="chat-profile-intro">
          <div class="chat-profile-avatar">C</div>
          <div class="chat-profile-name">Clent</div>
          <div class="chat-profile-sub">wants to borrow a <strong>Pencil</strong></div>
        </div>

        <!-- Empty state — no messages yet -->
        <div class="chat-empty">
          <i class="ti ti-message-dots"></i>
          <p>No messages yet.<br />Start the conversation!</p>
        </div>

      </div>

      <!-- Chat input -->
      <div class="chat-input-bar">
        <input type="text" class="chat-input" placeholder="Lend to Clent" />
        <button class="chat-send"><i class="ti ti-send"></i></button>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>

  <script>
    /* ── Read source from URL ── */
    const params = new URLSearchParams(window.location.search);
    const from = params.get('from') || 'home';

    /* ── Back button goes to post2 with correct source ── */
    document.getElementById('chatBack').href = `post2.html?from=${from}`;
  </script>

</body>

</html>
