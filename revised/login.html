<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLP Lost & Found — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="login">

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span>●●●</span>
    </div>

    <div class="screen">
      <div class="login-screen">

        <!-- Logo -->
        <img src="images/logo.png" alt="PLP Box Logo" class="login-logo-img" />

        <!-- Form -->
        <form class="login-form" id="loginForm" onsubmit="return handleLogin(event)">
          <input type="text" class="login-input" id="loginUser" placeholder="PLP email or student number"
            autocomplete="username" />
          <input type="password" class="login-input" id="loginPass" placeholder="Password"
            autocomplete="current-password" />
          <div class="login-error" id="loginError"></div>
          <button type="submit" class="login-btn login-btn-primary">Log In</button>
        </form>

        <!-- Forgot -->
        <a href="#" class="login-forgot">Forgotten Password?</a>

        <!-- Divider -->
        <div class="login-divider"></div>

        <!-- Create account -->
        <button class="login-btn login-btn-secondary" onclick="window.location.href='signup.html'">Create new
          account</button>

        <!-- Footer brand -->
        <div class="login-footer">
          <img src="images/logo.png" alt="PLP Box Logo" class="login-footer-logo-img" />
          <span class="login-footer-text">Box</span>
        </div>

      </div>
    </div>
  </div>

  <script>
    /*
     * ─── DUMMY ACCOUNTS ───
     * Add more objects to this array for future accounts.
     * Each account needs: user, pass, and redirect.
     */
    const ACCOUNTS = [
      {
        user: 'student@plp.edu',
        pass: 'pass123',
        redirect: 'main-home.html'
      }
      // ── Add more accounts here ──
      // {
      //   user: 'anna@plp.edu',
      //   pass: 'anna2025',
      //   redirect: 'main-home.html'
      // },
    ];

    function handleLogin(e) {
      e.preventDefault();

      const userInput = document.getElementById('loginUser').value.trim().toLowerCase();
      const passInput = document.getElementById('loginPass').value;
      const errorEl = document.getElementById('loginError');

      // Clear previous error
      errorEl.textContent = '';

      // Empty check
      if (!userInput || !passInput) {
        errorEl.textContent = 'Please fill in both fields.';
        return false;
      }

      // Match against accounts
      const match = ACCOUNTS.find(
        acc => acc.user.toLowerCase() === userInput && acc.pass === passInput
      );

      if (match) {
        window.location.href = match.redirect;
      } else {
        errorEl.textContent = 'Invalid email/student number or password.';
        document.getElementById('loginPass').value = '';
      }

      return false;
    }
  </script>

</body>

</html>
