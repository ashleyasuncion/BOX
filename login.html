<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLP Lost & Found — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="login">

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span>●●●</span>
    </div>

    <div class="screen">
      <div class="login-screen">

        <!-- Logo -->
        <img src="images/logo.png" alt="PLP Box Logo" class="login-logo-img" />

        <!-- Form -->
        <form class="login-form" id="loginForm" onsubmit="return handleLogin(event)">
          <input type="text" class="login-input" id="loginUser" placeholder="PLP email or student number"
            autocomplete="username" />
          <input type="password" class="login-input" id="loginPass" placeholder="Password"
            autocomplete="current-password" />
          <div class="login-error" id="loginError"></div>
          <button type="submit" class="login-btn login-btn-primary">Log In</button>
        </form>

        <!-- Forgot -->
        <a href="#" class="login-forgot">Forgotten Password?</a>

        <!-- Divider -->
        <div class="login-divider"></div>

        <!-- Create account -->
        <button class="login-btn login-btn-secondary" onclick="window.location.href='signup.html'">Create new
          account</button>

        <!-- Footer brand -->
        <div class="login-footer">
          <img src="images/logo.png" alt="PLP Box Logo" class="login-footer-logo-img" />
          <span class="login-footer-text">Box</span>
        </div>

      </div>
    </div>
  </div>

  <script>
    /*
        * ─── ACCOUNT REGISTRY ───
        * role: 'admin' | 'student'
        * allowedPosts: array of allowed categories — null means all
        * defaultPost: which pill is pre-selected on post.html
        */
    const ACCOUNTS = [
      {
        user: 'student',
        pass: 'pass123',
        role: 'student',
        displayName: 'Yves Santos',
        handle: '@yves.santos',
        studentId: '2024-00123',
        email: 'yves.santos@plp.edu',
        course: 'BSBA 3A',
        avatar: 'Y',
        allowedPosts: ['lost', 'found', 'lend', 'borrow'],
        defaultPost: null,
        redirect: 'main-home.html'
      },
      {
        user: 'lost.user',
        pass: 'lost123',
        role: 'student',
        displayName: 'Leo Santos',
        handle: '@leo.santos',
        studentId: '2024-00124',
        email: 'leo.santos@plp.edu',
        course: 'BSIT 2B',
        avatar: 'L',
        allowedPosts: ['lost'],
        defaultPost: 'lost',
        redirect: 'main-lost.html'
      },
      {
        user: 'found.user',
        pass: 'found123',
        role: 'student',
        displayName: 'Faye Reyes',
        handle: '@faye.reyes',
        studentId: '2024-00125',
        email: 'faye.reyes@plp.edu',
        course: 'BSED 1A',
        avatar: 'F',
        allowedPosts: ['found'],
        defaultPost: 'found',
        redirect: 'main-found.html'
      },
      {
        user: 'lend.user',
        pass: 'lend123',
        role: 'student',
        displayName: 'Lance Cruz',
        handle: '@lance.cruz',
        studentId: '2024-00126',
        email: 'lance.cruz@plp.edu',
        course: 'BSBA 1C',
        avatar: 'LC',
        allowedPosts: ['lend'],
        defaultPost: 'lend',
        redirect: 'main-lend.html'
      },
      {
        user: 'borrow.user',
        pass: 'borrow123',
        role: 'student',
        displayName: 'Bea Mendoza',
        handle: '@bea.mendoza',
        studentId: '2024-00127',
        email: 'bea.mendoza@plp.edu',
        course: 'BSBA 2A',
        avatar: 'B',
        allowedPosts: ['borrow'],
        defaultPost: 'borrow',
        redirect: 'main-borrow.html'
      },
      {
        user: 'admin',
        pass: 'admin123',
        role: 'admin',
        displayName: 'PLP Box Admin',
        handle: '@plpbox.admin',
        studentId: 'ADMIN-001',
        email: 'admin@plp.edu',
        course: 'Administrator',
        avatar: 'A',
        allowedPosts: ['lost', 'found', 'lend', 'borrow'],
        defaultPost: null,
        redirect: 'admin-main-home.html'
      }
    ];

    function handleLogin(e) {
      e.preventDefault();

      const userInput = document.getElementById('loginUser').value.trim().toLowerCase();
      const passInput = document.getElementById('loginPass').value;
      const errorEl = document.getElementById('loginError');

      errorEl.textContent = '';

      if (!userInput || !passInput) {
        errorEl.textContent = 'Please fill in both fields.';
        return false;
      }

      const match = ACCOUNTS.find(
        acc => acc.user.toLowerCase() === userInput && acc.pass === passInput
      );

      if (match) {
        /* Store account in sessionStorage — available across all pages */
        sessionStorage.setItem('plpbox_account', JSON.stringify(match));
        window.location.href = match.redirect;
      } else {
        errorEl.textContent = 'Invalid email/student number or password.';
        document.getElementById('loginPass').value = '';
      }

      return false;
    }
  </script>

</body>

</html>
